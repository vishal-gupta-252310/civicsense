{% extends "issues/base.html" %}
{% block title %}Check Your Email · CivicSense{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>
      </div>
      <h3 class="mb-1">Check your email</h3>
      <p class="text-muted mb-0">
        If an account exists for that address, you'll receive a link to reset
        your password shortly. Check your inbox (and spam folder).
      </p>
    </div>
    <p class="mt-3 mb-0 text-center">
      <a href="{% url 'login' %}">Back to sign in</a>
    </p>
  </div>
</div>
{% endblock %}
