{% extends "issues/base.html" %}
{% block title %}Password Changed · CivicSense{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h3 class="mb-1">Password changed</h3>
      <p class="text-muted mb-0">Your password has been updated. You can now sign in with it.</p>
    </div>
    <p class="mt-3 mb-0 text-center">
      <a class="btn btn-primary w-100 py-2" href="{% url 'login' %}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
