<div class="auth-wrap">
  <div class="auth-card error-card">
    <div class="auth-head">
      <div class="auth-logo error-logo">
        {% if lock %}
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        {% else %}
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {% endif %}
      </div>
      <h1 class="error-code">{{ code }}</h1>
      <h3 class="mb-1">{{ heading }}</h3>
      <p class="text-muted mb-4">{{ message }}</p>
      <div class="d-flex gap-2 justify-content-center">
        <a href="javascript:history.back()" class="btn btn-secondary px-4">Go back</a>
        <a href="{% url 'home' %}" class="btn btn-primary px-4">Back to home</a>
      </div>
    </div>
  </div>
</div>
